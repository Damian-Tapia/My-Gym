<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../../styles.css">
<style>body{margin:0;background:var(--surface-app);font-family:var(--font-sans);padding:20px;color:var(--text-primary)}</style></head>
<body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script>window.MYGYM_ICON_BASE='../../assets/icons/'</script>
<script src="../../_ds_bundle.js"></script>
<script type="text/babel">
const { Input, Stepper, Switch, SegmentedControl, OptionRow } = window.MyGymDesignSystem_8243f3;
function Demo(){
  const [w,setW]=React.useState(40);const [on,setOn]=React.useState(true);const [seg,setSeg]=React.useState('Semana');const [sel,setSel]=React.useState(true);
  return <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20,alignItems:'start'}}>
    <div style={{display:'grid',gap:16}}>
      <Input label="Peso corporal" value="72" suffix="kg" icon="user" />
      <Input label="Correo" placeholder="tu@correo.com" error="Correo no válido" />
      <SegmentedControl options={['Semana','Mes','Año']} value={seg} onChange={setSeg} />
    </div>
    <div style={{display:'grid',gap:16,justifyItems:'start'}}>
      <Stepper value={w} step={2.5} unit="kg" onChange={setW} />
      <div style={{display:'flex',gap:12,alignItems:'center'}}><Switch checked={on} onChange={setOn} /><Switch checked={false} /><Switch checked disabled /></div>
      <OptionRow icon="dumbbell" title="Prensa de piernas" subtitle="Disponible" multi selected={sel} onClick={()=>setSel(!sel)} />
      <OptionRow title="Principiante" subtitle="0–6 meses entrenando" />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script></body></html>
