<!-- @dsCard group="Brand" viewport="700x190" name="Motion" subtitle="Fast, short, no bounce; 0.97 scale on press" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-sans)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{display:block;font:var(--text-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin-top:6px}.v{display:block;font:var(--text-caption);font-family:var(--font-mono);color:var(--text-secondary)}</style></head><body><div style="display:grid;gap:12px;max-width:560px">
<div style="display:flex;align-items:center;gap:12px"><code style="font-family:var(--font-mono);font-size:12px;color:var(--text-accent);width:120px">--dur-instant</code><div style="height:4px;background:var(--amber-500);border-radius:2px;width:40px"></div><span style="font:var(--text-caption);color:var(--text-muted)">80ms · press feedback</span></div><div style="display:flex;align-items:center;gap:12px"><code style="font-family:var(--font-mono);font-size:12px;color:var(--text-accent);width:120px">--dur-fast</code><div style="height:4px;background:var(--amber-500);border-radius:2px;width:70px"></div><span style="font:var(--text-caption);color:var(--text-muted)">140ms · hover, colour changes</span></div><div style="display:flex;align-items:center;gap:12px"><code style="font-family:var(--font-mono);font-size:12px;color:var(--text-accent);width:120px">--dur-base</code><div style="height:4px;background:var(--amber-500);border-radius:2px;width:110px"></div><span style="font:var(--text-caption);color:var(--text-muted)">220ms · toggles, bars</span></div><div style="display:flex;align-items:center;gap:12px"><code style="font-family:var(--font-mono);font-size:12px;color:var(--text-accent);width:120px">--dur-sheet</code><div style="height:4px;background:var(--amber-500);border-radius:2px;width:190px"></div><span style="font:var(--text-caption);color:var(--text-muted)">380ms · bottom sheet in/out</span></div>
<div style="font:var(--text-caption);color:var(--text-secondary)">Easing: <code style="font-family:var(--font-mono);font-size:12px;color:var(--text-accent)">cubic-bezier(0.32,0.72,0,1)</code> standard · <code style="font-family:var(--font-mono);font-size:12px;color:var(--text-accent)">cubic-bezier(0.16,1,0.3,1)</code> out. No bounce, no spring overshoot.</div>
</div></body></html>
