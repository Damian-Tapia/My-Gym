<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals — Ink" subtitle="Near-black surface ladder; depth comes from hairlines, not grey drops" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-sans)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{display:block;font:var(--text-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin-top:6px}.v{display:block;font:var(--text-caption);font-family:var(--font-mono);color:var(--text-secondary)}</style></head><body><div class="g">
<div class="sw"><div class="chip" style="background:#0B0B0C"></div><span class="n">950 app</span><span class="v">--surface-app</span></div><div class="sw"><div class="chip" style="background:#121214"></div><span class="n">900 sheet</span><span class="v">--surface-sheet</span></div><div class="sw"><div class="chip" style="background:#17171A"></div><span class="n">850 card</span><span class="v">--surface-card</span></div><div class="sw"><div class="chip" style="background:#1E1E22"></div><span class="n">800 raised</span><span class="v">--surface-raised</span></div><div class="sw"><div class="chip" style="background:#2E2E36"></div><span class="n">700 border</span><span class="v">--border-default</span></div><div class="sw"><div class="chip" style="background:#6E6E7A"></div><span class="n">400 muted</span><span class="v">--text-muted</span></div>
</div></body></html>
