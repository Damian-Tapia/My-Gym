<!-- @dsCard group="Brand" viewport="700x200" name="Elevation & glow" subtitle="Hairline + deep shadow for depth; amber glow only under the primary CTA" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-sans)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{display:block;font:var(--text-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin-top:6px}.v{display:block;font:var(--text-caption);font-family:var(--font-mono);color:var(--text-secondary)}</style></head><body><div class="g" style="gap:16px">
<div style="width:150px;height:76px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);box-shadow:var(--shadow-card);display:flex;align-items:center;justify-content:center;font:var(--text-caption);color:var(--text-secondary)">--shadow-card</div>
<div style="width:150px;height:76px;background:var(--surface-raised);border:1px solid var(--border-default);border-radius:var(--radius-card);box-shadow:var(--shadow-raised);display:flex;align-items:center;justify-content:center;font:var(--text-caption);color:var(--text-secondary)">--shadow-raised</div>
<div style="width:150px;height:76px;background:var(--amber-500);color:var(--ink-1000);border-radius:var(--radius-card);box-shadow:var(--shadow-accent-glow);display:flex;align-items:center;justify-content:center;font:var(--text-body-strong)">accent glow</div>
<div style="width:150px;height:76px;background:var(--surface-card);border:1px solid var(--border-focus);border-radius:var(--radius-card);box-shadow:var(--shadow-focus);display:flex;align-items:center;justify-content:center;font:var(--text-caption);color:var(--text-secondary)">--shadow-focus</div>
</div></body></html>
