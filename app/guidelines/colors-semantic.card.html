<!-- @dsCard group="Colors" viewport="700x150" name="Semantic status" subtitle="Success, danger and info; each has a 14%-alpha background pair" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-sans)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{display:block;font:var(--text-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin-top:6px}.v{display:block;font:var(--text-caption);font-family:var(--font-mono);color:var(--text-secondary)}</style></head><body><div class="g">
<div class="sw"><div class="chip" style="background:var(--status-success-bg);border-color:transparent;display:flex;align-items:center;justify-content:center;color:var(--status-success-fg);font:var(--text-body-strong)">Hecho</div><span class="n">Success</span><span class="v">#3ED598</span></div>
<div class="sw"><div class="chip" style="background:var(--status-danger-bg);border-color:transparent;display:flex;align-items:center;justify-content:center;color:var(--status-danger-fg);font:var(--text-body-strong)">Fallo</div><span class="n">Danger</span><span class="v">#FF4D4D</span></div>
<div class="sw"><div class="chip" style="background:var(--status-info-bg);border-color:transparent;display:flex;align-items:center;justify-content:center;color:var(--status-info-fg);font:var(--text-body-strong)">Nuevo</div><span class="n">Info</span><span class="v">#4DA3FF</span></div>
<div class="sw"><div class="chip" style="background:var(--status-warn-bg);border-color:transparent;display:flex;align-items:center;justify-content:center;color:var(--status-warn-fg);font:var(--text-body-strong)">Aviso</div><span class="n">Warn</span><span class="v">#FFC46B</span></div>
</div></body></html>
