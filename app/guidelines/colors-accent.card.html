<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-sans)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{display:block;font:var(--text-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin-top:6px}.v{display:block;font:var(--text-caption);font-family:var(--font-mono);color:var(--text-secondary)}</style></head><body><div class="g">
<div class="sw"><div class="chip" style="background:#FFC46B"></div><span class="n">300</span><span class="v">--amber-300</span></div><div class="sw"><div class="chip" style="background:#FFB244"></div><span class="n">400</span><span class="v">--amber-400</span></div><div class="sw"><div class="chip" style="background:#FF9F1C"></div><span class="n">500 · brand</span><span class="v">--amber-500</span></div><div class="sw"><div class="chip" style="background:#E8890A"></div><span class="n">600</span><span class="v">--amber-600</span></div><div class="sw"><div class="chip" style="background:#B86A05"></div><span class="n">700</span><span class="v">--amber-700</span></div><div class="sw"><div class="chip" style="background:rgba(255,159,28,0.12)"></div><span class="n">soft 12%</span><span class="v">--surface-accent-soft</span></div>
</div></body></html>
