<!-- @dsCard group="Brand" viewport="700x200" name="Surface stack" subtitle="Four near-black levels; each step up is lighter and hairlined" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles/styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-sans)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{display:block;font:var(--text-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin-top:6px}.v{display:block;font:var(--text-caption);font-family:var(--font-mono);color:var(--text-secondary)}</style></head><body><div style="background:var(--surface-app);padding:14px;border-radius:var(--radius-lg)">
<span class="n" style="margin:0 0 8px">app · #0B0B0C</span>
<div style="background:var(--surface-sheet);padding:14px;border-radius:var(--radius-lg);border:1px solid var(--border-subtle)">
<span class="n" style="margin:0 0 8px">sheet · #121214</span>
<div style="background:var(--surface-card);padding:14px;border-radius:var(--radius-card);border:1px solid var(--border-subtle)">
<span class="n" style="margin:0 0 8px">card · #17171A</span>
<div style="background:var(--surface-raised);padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border-default);font:var(--text-caption);color:var(--text-secondary)">raised · #1E1E22</div>
</div></div></div></body></html>
