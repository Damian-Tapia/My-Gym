<!-- @dsCard group="Type" viewport="700x200" name="Mono numerals — IBM Plex Mono" subtitle="Every number the user tracks; tabular figures so columns line up" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles/styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-sans)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{display:block;font:var(--text-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin-top:6px}.v{display:block;font:var(--text-caption);font-family:var(--font-mono);color:var(--text-secondary)}</style></head><body><div style="display:flex;gap:32px;align-items:flex-end;font-variant-numeric:tabular-nums">
<div><div style="font:var(--text-metric);font-size:var(--fs-metric-xl)">42.5<span style="font-size:18px;color:var(--text-muted)">kg</span></div><span class="n">--fs-metric-xl · 56px</span></div>
<div><div style="font:var(--text-metric)">12 días</div><span class="n">--text-metric · 28px</span></div>
<div><div style="font:var(--text-label);letter-spacing:var(--ls-label);text-transform:uppercase">RACHA ACTUAL</div><span class="n">--text-label · 11px</span></div>
</div></body></html>
