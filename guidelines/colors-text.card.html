<!-- @dsCard group="Colors" viewport="700x150" name="Text on dark" subtitle="Four ink levels; body text never dips below --text-secondary" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles/styles.css">
<style>body{margin:0;padding:20px;background:var(--surface-app);color:var(--text-primary);font-family:var(--font-sans)}.g{display:flex;gap:10px;flex-wrap:wrap}.sw{width:104px}.chip{height:56px;border-radius:var(--radius-sm);border:1px solid var(--border-subtle)}.n{display:block;font:var(--text-label);letter-spacing:var(--ls-label);text-transform:uppercase;color:var(--text-muted);margin-top:6px}.v{display:block;font:var(--text-caption);font-family:var(--font-mono);color:var(--text-secondary)}</style></head><body><div style="display:grid;gap:8px;background:var(--surface-card);border:1px solid var(--border-subtle);border-radius:var(--radius-card);padding:16px">
<div style="font:var(--text-body-strong);color:var(--text-primary)">Primary — títulos y números · <code style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted)">--text-primary</code></div>
<div style="font:var(--text-body);color:var(--text-secondary)">Secondary — texto de apoyo · <code style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted)">--text-secondary</code></div>
<div style="font:var(--text-body);color:var(--text-muted)">Muted — etiquetas y metadatos · <code style="font-family:var(--font-mono);font-size:12px">--text-muted</code></div>
<div style="font:var(--text-body);color:var(--text-accent)">Accent — enlaces y valores destacados · <code style="font-family:var(--font-mono);font-size:12px;color:var(--text-muted)">--text-accent</code></div>
</div></body></html>
